  en: Service
  de: Dienst
  es: "Servicio"
  fr: "Service"
  pt-BR: "Serviço"
  ru: "Служба"
  zh-CN: "服务"
service.title:
  en: Search service
  de: Suchdienst
  es: "Servicio de búsqueda"
  fr: "Service de recherche"
  pt-BR: "Serviço de pesquisa"
  ru: "Служба поиска"
  zh-CN: "搜索服务"
service.desc:
  en: "Indexes every local disk as root and keeps the index current live. Each user sees only what they could open themselves. Without it, Anything indexes just the folders under “Scan”."
  de: "Indiziert alle lokalen Laufwerke mit Root-Rechten und hält den Index live aktuell. Jeder Benutzer sieht nur, was er selbst öffnen darf. Ohne den Dienst durchsucht Anything nur die Ordner unter „Scan“."
  es: "Indexa todos los discos locales como root y mantiene el índice actualizado en tiempo real. Cada usuario solo ve lo que puede abrir por sí mismo. Sin él, Anything solo indexa las carpetas de «Escaneo»."
  fr: "Indexe tous les disques locaux en tant que root et tient l’index à jour en temps réel. Chaque utilisateur ne voit que ce qu’il peut ouvrir lui-même. Sans lui, Anything n’indexe que les dossiers indiqués sous « Analyse »."
