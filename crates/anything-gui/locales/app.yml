  de: Vorschaubilder anzeigen
  es: "Mostrar vistas previas"
  fr: "Afficher les aperçus"
  pt-BR: "Mostrar miniaturas"
  ru: "Показывать миниатюры"
  zh-CN: "显示预览"
settings.previews.desc:
  en: Pictures, videos, PDFs and more get a preview in the grid. Previews are made only for what you look at.
  de: Bilder, Videos, PDFs und mehr bekommen im Raster eine Vorschau. Sie entstehen nur für das, was du dir ansiehst.
  es: "Imágenes, videos, PDF y más tienen una vista previa en la cuadrícula. Solo se crean para lo que estás viendo."
  fr: "Les images, vidéos, PDF et autres ont un aperçu dans la grille. Les aperçus ne sont créés que pour ce que vous regardez."
  pt-BR: "Imagens, vídeos, PDFs e mais ganham uma miniatura na grade. As miniaturas são criadas apenas para o que você está vendo."
  ru: "Изображения, видео, PDF и другие файлы получают миниатюру в сетке. Миниатюры создаются только для того, что вы просматриваете."
  zh-CN: "图片、视频、PDF 等文件会在网格中显示预览。只为你正在查看的内容生成预览。"
settings.clear_previews:
  en: Preview cache
  de: Vorschau-Speicher
  es: "Caché de vistas previas"
  fr: "Cache des aperçus"
  pt-BR: "Cache de miniaturas"
  ru: "Кэш миниатюр"
  zh-CN: "预览缓存"
settings.clear_previews.desc:
  en: Deletes all previews Anything has made. They are made again when needed.
  de: Löscht alle Vorschaubilder, die Anything erstellt hat. Sie entstehen bei Bedarf neu.
  es: "Elimina todas las vistas previas creadas por Anything. Se vuelven a crear cuando hacen falta."
  fr: "Supprime tous les aperçus créés par Anything. Ils sont recréés si nécessaire."
  pt-BR: "Exclui todas as miniaturas criadas pelo Anything. Elas são criadas novamente quando necessário."
  ru: "Удаляет все миниатюры, созданные Anything. При необходимости они будут созданы заново."
  zh-CN: "删除 Anything 生成的所有预览。需要时会重新生成。"
