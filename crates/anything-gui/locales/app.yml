  de: "Ordner, die Programme selbst neu anlegen und die kaum jemand durchsucht, oft sehr lebhaft: %{names}."
  es: "Carpetas que los programas reconstruyen solos y que casi nadie busca, a menudo muy activas: %{names}."
  fr: "Dossiers que les programmes reconstruisent eux-mêmes et que presque personne ne cherche, souvent très actifs : %{names}."
  pt-BR: "Pastas que os programas recriam sozinhos e que quase ninguém procura, muitas vezes muito ativas: %{names}."
  ru: "Папки, которые программы пересоздают сами и в которых почти никто не ищет; часто очень активные: %{names}."
  zh-CN: "程序会自行重建、几乎无人搜索且经常频繁变化的文件夹：%{names}。"
