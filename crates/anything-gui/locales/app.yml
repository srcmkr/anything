  ru: "Индексирует все локальные диски с правами root и обновляет индекс в реальном времени. Каждый пользователь видит только то, что может открыть сам. Без службы Anything индексирует только папки из раздела «Сканирование»."
  zh-CN: "以 root 身份索引所有本地磁盘，并实时更新索引。每个用户只能看到自己有权打开的内容。没有此服务时，Anything 只索引“扫描”中设置的文件夹。"
