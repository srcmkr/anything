  en: Included folders
  de: Einbezogene Ordner
  es: "Carpetas incluidas"
  fr: "Dossiers inclus"
  pt-BR: "Pastas incluídas"
  ru: "Включённые папки"
  zh-CN: "包含的文件夹"
settings.include.desc:
  en: The scan covers these folders and everything below them. ~ stands for your home folder.
  de: Der Scan erfasst diese Ordner und alles darunter. ~ steht für deinen Home-Ordner.
  es: "El escaneo abarca estas carpetas y todo lo que contienen. ~ representa tu carpeta personal."
  fr: "L’analyse couvre ces dossiers et tout leur contenu. ~ désigne votre dossier personnel."
  pt-BR: "A varredura abrange estas pastas e tudo dentro delas. ~ representa sua pasta pessoal."
  ru: "Сканируются эти папки и всё их содержимое. ~ означает домашнюю папку."
  zh-CN: "扫描这些文件夹及其中的全部内容。~ 代表你的主文件夹。"
settings.include.empty:
  en: Nothing is included, so nothing will be found.
  de: Nichts ist einbezogen, also wird nichts gefunden.
  es: "No hay nada incluido, así que no se encontrará nada."
  fr: "Rien n’est inclus, donc rien ne sera trouvé."
  pt-BR: "Nada está incluído, então nada será encontrado."
  ru: "Ничего не включено, поэтому ничего не будет найдено."
  zh-CN: "未包含任何文件夹，因此找不到任何内容。"
settings.include.missing:
  en: This folder does not exist.
  de: Diesen Ordner gibt es nicht.
  es: "Esta carpeta no existe."
  fr: "Ce dossier n’existe pas."
  pt-BR: "Esta pasta não existe."
  ru: "Этой папки не существует."
  zh-CN: "此文件夹不存在。"
settings.exclude:
  en: Excluded folders
  de: Ausgeschlossene Ordner
  es: "Carpetas excluidas"
  fr: "Dossiers exclus"
  pt-BR: "Pastas excluídas"
  ru: "Исключённые папки"
  zh-CN: "排除的文件夹"
settings.exclude.desc:
  en: A path like /home/* skips every folder directly in /home. A name like node_modules or *.tmp is skipped wherever it appears. System folders such as /proc are always skipped.
  de: Ein Pfad wie /home/* lässt jeden Ordner direkt in /home aus. Ein Name wie node_modules oder *.tmp wird überall ausgelassen. Systemordner wie /proc werden immer ausgelassen.
  es: "Una ruta como /home/* omite todas las carpetas que están directamente en /home. Un nombre como node_modules o *.tmp se omite dondequiera que aparezca. Las carpetas del sistema como /proc se omiten siempre."
  fr: "Un chemin comme /home/* ignore chaque dossier situé directement dans /home. Un nom comme node_modules ou *.tmp est ignoré partout où il apparaît. Les dossiers système comme /proc sont toujours ignorés."
  pt-BR: "Um caminho como /home/* ignora todas as pastas diretamente em /home. Um nome como node_modules ou *.tmp é ignorado onde quer que apareça. Pastas do sistema como /proc são sempre ignoradas."
  ru: "Путь вида /home/* пропускает все папки непосредственно в /home. Имя вроде node_modules или *.tmp пропускается везде, где встречается. Системные папки, например /proc, пропускаются всегда."
  zh-CN: "像 /home/* 这样的路径会跳过 /home 下的每个直接子文件夹。像 node_modules 或 *.tmp 这样的名称无论出现在哪里都会被跳过。/proc 等系统文件夹始终会被跳过。"
settings.exclude.outside:
  en: Outside the included folders, so it has no effect.
  de: Liegt außerhalb der einbezogenen Ordner und wirkt daher nicht.
  es: "Está fuera de las carpetas incluidas, así que no tiene efecto."
  fr: "En dehors des dossiers inclus, donc sans effet."
  pt-BR: "Fora das pastas incluídas, por isso não tem efeito."
  ru: "Находится вне включённых папок, поэтому не действует."
  zh-CN: "位于包含的文件夹之外，因此不起作用。"
