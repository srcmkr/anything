settings.rescan.desc:
  en: Reads all included folders again. Changing the rules above starts a new scan by itself.
  de: Liest alle einbezogenen Ordner neu ein. Bei geänderten Regeln passiert das von selbst.
  es: "Vuelve a leer todas las carpetas incluidas. Si cambias las reglas de arriba, esto ocurre solo."
  fr: "Relit tous les dossiers inclus. Modifier les règles ci-dessus lance automatiquement une nouvelle analyse."
  pt-BR: "Lê novamente todas as pastas incluídas. Alterar as regras acima inicia uma nova varredura automaticamente."
  ru: "Заново читает все включённые папки. При изменении правил выше это происходит автоматически."
  zh-CN: "重新读取所有包含的文件夹。更改上方的规则会自动开始新的扫描。"
