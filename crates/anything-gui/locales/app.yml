  de: Vorschaubilder werden nur aus diesem Ordner gelesen und nur hier gespeichert.
  es: "Las miniaturas solo se leen de esta carpeta y solo se guardan en ella."
  fr: "Les miniatures sont lues et enregistrées uniquement dans ce dossier."
  pt-BR: "As miniaturas são lidas e gravadas somente nesta pasta."
  ru: "Миниатюры читаются и сохраняются только в этой папке."
  zh-CN: "缩略图只从此文件夹读取，也只保存到此文件夹。"
